name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/next
  KEEP_VERSIONS: 6

  # Turborepo target: the Next.js app and everything it depends on
  TURBO_FILTER: ./apps/next
  DOCKERFILE: apps/next/Dockerfile

  # Implicitly provide env variables for tests
  API_KEY_SK: ${{ secrets.API_KEY_SK }}

  NEXT_PUBLIC_TELEGRAM_BOT_URL: ${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_URL }}
  NEXT_PUBLIC_NEKOMI_NEXTJS_URL: ${{ vars.NEXT_PUBLIC_NEKOMI_NEXTJS_URL }}
  NEXT_PUBLIC_NEKOMI_API_URL: ${{ vars.NEXT_PUBLIC_NEKOMI_API_URL }}

jobs:
  test-and-build:
    name: Lint & build (apps/next)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter="${{ env.TURBO_FILTER }}" --cache-dir=.turbo

      - name: Type check
        run: pnpm turbo run typecheck --filter="${{ env.TURBO_FILTER }}" --cache-dir=.turbo

      - name: Build
        run: pnpm turbo run build --filter="${{ env.TURBO_FILTER }}" --cache-dir=.turbo

  docker:
    name: Build & push Docker image (apps/next)
    runs-on: ubuntu-latest
    needs: test-and-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          # Monorepo root as context so the Dockerfile can reach workspace packages
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=next
          cache-to: type=gha,mode=max,scope=next
          provenance: false
          build-args: |
            APP_NAME=@nekomi/next
            NEXT_PUBLIC_NEKOMI_API_URL=${{ vars.NEXT_PUBLIC_NEKOMI_API_URL }}