name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

env:
  # Implicitly provide env variables for tests
  API_KEY_SK: ${{ secrets.API_KEY_SK }}

  NEXT_PUBLIC_TELEGRAM_BOT_URL: ${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_URL }}
  NEXT_PUBLIC_NEKOMI_NEXTJS_URL: ${{ vars.NEXT_PUBLIC_NEKOMI_NEXTJS_URL }}
  NEXT_PUBLIC_NEKOMI_API_URL: ${{ vars.NEXT_PUBLIC_NEKOMI_API_URL }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    if: github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'Merge pull request')

    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build